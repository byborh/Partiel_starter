<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>byborh - Partiel Harry Potter</title>
  </head>
  <body class="page_perso">
    <header class="header">
      <div class="header__right">
        <a href="index.html">
          <img src="./images/logo/logo.png" alt="Harry Potter Wiki" />
        </a>
      </div>
      <div class="header__left">
        <h1>byborh - Partiel Harry Potter</h1>
        <ul>
          <li>Students</li>
          <li>Staff</li>
          <li>Houses</li>
          <li>Spells</li>
        </ul>
        <img src="./images/menu.png" alt="Menu" />
      </div>
    </header>
    <main>
      <section>
        <h3>Harry Potter</h3>
        <div class="perso">
          <figure class="perso__left">
            <img src="./images/characters/harry.webp" alt="Harry Potter" />
            <figcaption>Daniel Radcliffe</figcaption>
          </figure>
          <div class="perso__right">
            <div>
              <div>
                <p class="attr">Date of birth</p>
                <p>31/07/1980</p>

              <div>
                <p class="attr">Ancestry</p>

              </div>

              </div>
              <div>

              </div>
            </div>
            <div>
              <div>
                <p class="attr">Patronus</p>
                <p>Stag</p>
              </div>
              <div>
                <p class="attr">Wand</p>
                <p>Holly, phoenix feather, 11"</p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="house__perso">
        <img src="./images/logo/Gryffindor.png" alt="Gryffindor" />
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
    <script src="./js/menu.js"></script>

</html>
