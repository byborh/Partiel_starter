<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>TON PRENOM NOM - Partiel Harry Potter</title>
  </head>
  <body>
    <header class="header">
      <div class="header__right">
        <img src="./images/logo/logo.png" alt="Harry Potter Wiki" />
      </div>
      <div class="header__left">
        <h1>TON PRENOM NOM - Wiki Harry Potter</h1>
        <ul>
          <li>Students</li>
          <li>Staff</li>
          <li>Houses</li>
          <li>Spells</li>
        </ul>
        <img src="./images/menu.png" alt="Menu" />
      </div>
    </header>
    <main>
      <section>
        <h3>Houses</h3>
        <div class="houses">
          <div><img src="./images/logo/Gryffindor.png" alt="Gryffindor" /></div>
          <div><img src="./images/logo/Slytherin.png" alt="Slytherin" /></div>
          <div><img src="./images/logo/Hufflepuff.png" alt="Hufflepuff" /></div>
          <div><img src="./images/logo/Ravenclaw.png" alt="Ravenclaw" /></div>
        </div>
      </section>
      <section>
        <h3>Characters</h3>
        <div class="characters">
          <div>
            <img src="./images/characters/harry.webp" alt="Harry Potter" />
            <p>Harry Potter</p>
          </div>
          <div>
            <img src="./images/characters/hermione.webp" alt="Hermione Granger" />
            <p>Hermione Granger</p>
          </div>
          <div>
            <img src="./images/characters/ron.webp" alt="Ron Weasley" />
            <p>Ron Weasley</p>
          </div>
          <div>
            <img src="./images/characters/draco.webp" alt="Draco Malfoy" />
            <p>Draco Malfoy</p>
          </div>
          <div>
            <img src="./images/characters/cedric.webp" alt="Cedric Diggory" />
            <p>Cedric Diggory</p>
          </div>
          <div>
            <img src="./images/characters/cho.webp" alt="Cho Chang" />
            <p>Cho Chang</p>
          </div>
          <div>
            <img src="./images/characters/snape.webp" alt="Severus Snape" />
            <p>Severus Snape</p>
          </div>
          <div>
            <img src="./images/characters/mcgonagall.webp" alt="Minerva McGonagall" />
            <p>Minerva McGonagall</p>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
