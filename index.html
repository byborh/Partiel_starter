<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>byborh - Partiel Harry Potter</title>
  </head>
  <body>
    <header class="header">
      <div class="header__right">
        <img src="./images/logo/logo.png" alt="Harry Potter Wiki" />
      </div>
      <div class="header__left">
        <h1>byborh - Wiki Harry Potter</h1>
        <ul>
          <li>Students</li>
          <li>Staff</li>
          <li>Houses</li>
          <li>Spells</li>
        </ul>
        <img src="./images/menu.png" alt="Menu" />
      </div>
    </header>
    <main>
      <section>
        <h3>Houses</h3>
        <div class="houses">
          <div data-house="Gryffindor"><img src="./images/logo/Gryffindor.png" alt="Gryffindor" /></div>
          <div data-house="Slytherin"><img src="./images/logo/Slytherin.png" alt="Slytherin" /></div>
          <div data-house="Hufflepuff"><img src="./images/logo/Hufflepuff.png" alt="Hufflepuff" /></div>
          <div data-house="Ravenclaw"><img src="./images/logo/Ravenclaw.png" alt="Ravenclaw" /></div>
        </div>
      </section>
      <div class="toolbar">
        <input class="toolbar__search" type="search" placeholder="Search by name" aria-label="Search by name" />
        <div class="toolbar__group">
          <button type="button" data-sort="name">A - Z</button>
          <button type="button" data-sort="age">Age</button>
        </div>
        <div class="toolbar__group">
          <button type="button" data-status="all">All</button>
          <button type="button" data-status="alive">Alive</button>
          <button type="button" data-status="dead">Dead</button>
        </div>
      </div>
      <section>
        <h3>Students</h3>
        <div class="characters" id="students"></div>
      </section>
      <section>
        <h3>Staff</h3>
        <div class="characters" id="staff"></div>
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
    <script src="./js/common.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
